name: Native launcher smoke

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - "dashboard/**"
      - "scripts/ensure_setup.py"
      - "docker-compose.yml"
      - "start.cmd"
      - "test/strategy_unit/test_native_launcher.py"
      - ".github/workflows/native_smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "native/**"
      - "dashboard/**"
      - "scripts/ensure_setup.py"
      - "docker-compose.yml"
      - "start.cmd"
      - "test/strategy_unit/test_native_launcher.py"
      - ".github/workflows/native_smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    name: ${{ matrix.os }} launcher
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile launcher sources
        run: python -m py_compile native/launcher.py dashboard/dashboard.py scripts/ensure_setup.py
      - name: Run launcher tests
        run: python -m pytest -q test/strategy_unit/test_native_launcher.py
