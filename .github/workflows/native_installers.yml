name: Native installers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload
        required: true
        default: v1.1.0

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build universal macOS DMG
        shell: bash
        run: |
          python -m pip install pyinstaller
          version="${{ github.event.release.tag_name || inputs.tag }}"
          chmod +x native/macos/build_dmg.sh
          native/macos/build_dmg.sh "${version#v}" universal2
      - name: Upload macOS installer
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/*.dmg --clobber

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: x64
      - name: Build Windows launcher
        shell: pwsh
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --clean --noconfirm --onefile --console `
            --name OKXQuantTrader `
            --distpath build/windows/launcher `
            --workpath build/windows/pyinstaller-work `
            --specpath build/windows `
            --hidden-import scripts.ensure_setup `
            --hidden-import dashboard.dashboard `
            --hidden-import dashboard.strategy_config `
            native/launcher.py
      - name: Stage packaged project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows/payload | Out-Null
          git archive --format=zip HEAD -o build/windows/payload.zip
          Expand-Archive build/windows/payload.zip build/windows/payload -Force
      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = "${{ github.event.release.tag_name || inputs.tag }}".TrimStart('v')
          $source = (Resolve-Path build/windows/payload).Path
          $launcher = (Resolve-Path build/windows/launcher/OKXQuantTrader.exe).Path
          $output = (Resolve-Path dist).Path
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "/DVERSION=$version" "/DSOURCE_DIR=$source" "/DLAUNCHER=$launcher" "/DOUTPUT_DIR=$output" native/windows/installer.nsi
      - name: Upload Windows installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/*.exe --clobber
