controller_name: pmm_simple
controller_type: market_making
connector_name: okx_perpetual
trading_pair: XRP-USDT
total_amount_quote: 50
leverage: 5
position_mode: ONEWAY
candles_interval: 1h
mean_window: 16
entry_z_score: 2
max_entry_z_score: 3.2
exit_z_score: 0.2
min_std_pct: 0.001
atr_length: 14
atr_stop_multiplier: 3
min_stop_loss: 0.004
max_stop_loss: 0.06
round_trip_cost_pct: 0.0012
min_net_edge_pct: 0.0018
min_reward_risk: 0.5
take_profit_quote: 1.2
fixed_unrealized_tp_quote: null
quote_offset_pct: 0.0002
max_bid_ask_spread_pct: 0.002
executor_refresh_time: 60
cooldown_time: 3600
stop_loss_cooldown_time: 3600
time_limit: 604800
signal_mode: momentum
momentum_lookback: 16
momentum_threshold: 0.008
risk_frac: 0.02
long_only: true
manual_kill_switch: false
